#cloud-config
# Primeira inicialização da VM do Athonis (Ubuntu 24.04).
# Instala Docker, clona o repositório (só a pasta infra/ é usada) e agenda o
# backup diário. A configuração com segredos (.env) é gerada depois, dentro da
# própria VM, pelo azure-provision.sh.
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - git
  - unattended-upgrades

runcmd:
  - systemctl enable --now docker
  - git clone --branch desenvMobile https://github.com/kevin-elazar/AthonisBackend.git /opt/athonis || true
  - chmod +x /opt/athonis/infra/*.sh
  - echo "0 3 * * * root /opt/athonis/infra/backup.sh >> /var/log/athonis-backup.log 2>&1" > /etc/cron.d/athonis-backup
  # Memória de troca: segura picos do build/pull numa VM de 4 GB.
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab
