# Prometheus: coleta a cada 15 s as métricas das APIs e da VM.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: athonis-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels: { ambiente: production }
      - targets: ["api-staging:8080"]
        labels: { ambiente: staging }

  - job_name: vm
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
