# SonarCloud: as chaves abaixo são confirmadas depois de importar o projeto
# (veja SETUP_CONTAS.md). A análise roda pelo GitHub Actions, com a cobertura.
sonar.organization=kevin-elazar
sonar.projectKey=kevin-elazar_AthonisBackend
sonar.projectName=Athonis API

sonar.sources=src
