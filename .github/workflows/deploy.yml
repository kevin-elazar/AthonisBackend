# Entrega contínua da API.
#
#   - CI verde na branch desenvMobile  -> atualiza o ambiente de STAGING
#                                        (o job deploy-staging do ci.yml chama este workflow)
#   - Release publicada (tag v*)        -> atualiza PRODUÇÃO com a imagem do commit da tag
#   - Manual (workflow_dispatch)        -> escolhe ambiente e imagem
#
# Sem SSH e sem senha guardada no GitHub: um runner do GitHub Actions instalado
# na VPS (infra/vps-bootstrap.sh) abre a conexão com o GitHub, pega este job e
# roda infra/deploy.sh. O usuário do runner só tem permissão de sudo para esse
# script. O deploy.sh baixa a imagem do GHCR, reinicia só o serviço e espera
# ficar saudável; se não ficar, volta para a imagem anterior.
#
# Enquanto a variável DEPLOY_HABILITADO não for "true" (runner ainda não
# instalado), o deploy é pulado em vez de ficar esperando um runner.
name: Deploy

on:
  # Chamado pelo ci.yml depois que a imagem é publicada. (Não usamos
  # workflow_run porque ele só dispara para workflows da branch padrão.)
  workflow_call:
    inputs:
      ambiente:
        type: string
        default: staging
      imagem:
        type: string
        required: false
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente
        type: choice
        options: [staging, production]
        default: staging
      imagem:
        description: Tag da imagem (ex. sha-<commit>, staging, main)
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-api-${{ inputs.ambiente || (github.event_name == 'release' && 'production') || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_HABILITADO == 'true' }}
    # Runner da VPS (nunca roda em pull request: só push, release e manual).
    runs-on: [self-hosted, athonis-deploy]
    environment:
      name: ${{ inputs.ambiente || (github.event_name == 'release' && 'production') || 'staging' }}
      url: ${{ (inputs.ambiente || (github.event_name == 'release' && 'production') || 'staging') == 'production' && vars.PRODUCTION_API_URL || vars.STAGING_API_URL }}
    env:
      AMBIENTE: ${{ inputs.ambiente || (github.event_name == 'release' && 'production') || 'staging' }}
      IMAGEM: ${{ inputs.imagem || format('sha-{0}', github.sha) }}
    steps:
      - name: Atualizar o servidor (${{ env.AMBIENTE }} <- ${{ env.IMAGEM }})
        run: |
          set -o pipefail
          sudo -n /opt/athonis/infra/deploy.sh api "$AMBIENTE" "$IMAGEM" 2>&1 | tee deploy.log
          grep -q "DEPLOY_OK" deploy.log || { echo "::error::O servidor não confirmou o deploy."; exit 1; }

  conferir:
    name: Conferir /health de fora
    needs: deploy
    runs-on: ubuntu-latest
    env:
      URL: ${{ (inputs.ambiente || (github.event_name == 'release' && 'production') || 'staging') == 'production' && vars.PRODUCTION_API_URL || vars.STAGING_API_URL }}
    steps:
      - name: Conferir /health de fora
        run: |
          [ -z "$URL" ] && { echo "::warning::URL do ambiente não configurada; pulando."; exit 0; }
          for i in $(seq 1 20); do
            curl -fsS "$URL/health" && exit 0
            sleep 6
          done
          echo "::error::$URL não respondeu"; exit 1
